<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>사과 게임</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main id="app">

    <!-- Home / mode selection -->
    <section class="screen" id="home">
      <h1>🍎 사과 게임</h1>

      <div class="section">
        <h3>모드 선택</h3>
        <div class="modes">
          <button class="mode secondary" data-intent="solo">혼자 연습</button>
          <button class="mode" data-intent="match">랜덤 매칭</button>
          <button class="mode secondary" data-intent="create">방 만들기</button>
          <button class="mode secondary" data-intent="join-open">코드로 입장</button>
        </div>
        <p class="helper">* 합이 10이 되도록 사과를 드래그하세요. 2분 안에 더 많이 지운 쪽 승!</p>
      </div>
    </section>

    <!-- Join with code -->
    <section class="screen" id="joinScreen" hidden>
      <h2>코드로 입장</h2>

      <div class="section">
        <h3>방 코드 입력</h3>
        <div class="field">
          <input id="joinCode" maxlength="6" placeholder="6자리 코드" autocomplete="off">
        </div>
        <div class="lobby-actions">
          <button id="joinSubmit">입장</button>
          <button id="joinBackBtn" class="ghost">뒤로</button>
        </div>
      </div>
    </section>

    <!-- Lobby -->
    <section class="screen" id="lobby" hidden>
      <h2 id="lobbyTitle">대기 중</h2>

      <div class="section" id="roomCodeSection">
        <h3>방 코드</h3>
        <div class="code-row">
          <code id="roomCode">------</code>
          <button id="copyCodeBtn" class="chip-btn">코드 복사</button>
          <button id="copyLinkBtn" class="chip-btn">초대 링크</button>
        </div>
        <p id="copyToast" class="copy-toast" hidden></p>
      </div>

      <div class="section">
        <h3>내 닉네임</h3>
        <div class="field">
          <input id="nickInput" maxlength="20" placeholder="닉네임 (최대 20자)" autocomplete="off">
        </div>
      </div>

      <div class="section" id="capacitySection" hidden>
        <h3>최대 인원</h3>
        <div class="capacity-control">
          <input id="capacityInput" type="number" min="2" max="50" step="1" value="10">
          <span class="muted">명</span>
        </div>
        <p class="helper" id="capacityHelper">호스트만 변경할 수 있습니다 (2~50명)</p>
      </div>

      <div class="section">
        <h3>참가자 <span class="muted" id="playerCount">0 / 2</span></h3>
        <p id="lobbyMsg" class="muted" style="text-align:center;">상대를 기다리는 중입니다.</p>
        <ul id="playerList"></ul>
        <div class="lobby-actions">
          <button id="startBtn" hidden>시작</button>
          <button id="cancelBtn" class="ghost">나가기</button>
        </div>
      </div>
    </section>

    <!-- Game -->
    <section class="screen game-screen" id="game" hidden>
      <header class="game-bar">
        <div class="game-stat">
          <span class="muted">점수</span>
          <strong id="myScoreNum">0</strong>
          <span class="muted">/ 170</span>
        </div>
        <div class="game-stat center">
          <strong id="myRank">#1</strong>
          <span class="muted">/ <span id="totalPlayers">1</span></span>
        </div>
        <div class="game-stat">
          <span class="muted">⏱</span>
          <strong id="timer">2:00</strong>
        </div>
      </header>
      <div class="progress" id="topProgress">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div id="replayControls" class="replay-controls" hidden>
        <div class="replay-scrub" id="replayScrub">
          <div class="replay-scrub-fill" id="replayScrubFill"></div>
          <div class="replay-scrub-thumb" id="replayScrubThumb"></div>
        </div>
        <div class="replay-bar">
          <button id="replayPlayPause" class="chip-btn replay-icon-btn" aria-label="재생/정지">❚❚</button>
          <div class="replay-time">
            <span id="replayCurrent">0:00</span>
            <span class="muted"> / 2:00</span>
          </div>
          <div class="replay-speeds">
            <button class="speed-btn" data-speed="1">1×</button>
            <button class="speed-btn" data-speed="2">2×</button>
            <button class="speed-btn active" data-speed="4">4×</button>
            <button class="speed-btn" data-speed="16">16×</button>
          </div>
          <button id="replayClose" class="chip-btn">닫기</button>
        </div>
      </div>
      <div class="game-layout">
        <aside class="leaderboard">
          <h3>LEADERBOARD <span class="muted">(<span id="lbCount">0</span>)</span></h3>
          <ul id="lbList"></ul>
        </aside>
        <main class="board-area">
          <canvas id="board"></canvas>
          <div id="sumBadge" class="sum-badge" hidden>0</div>
        </main>
      </div>
    </section>

    <!-- Result -->
    <section class="screen" id="result" hidden>
      <h2 id="resultTitle">결과</h2>
      <div class="section">
        <ul id="finalScores"></ul>
        <div class="result-actions">
          <button id="replayBtn" class="ghost">리플레이 보기</button>
          <button id="rematchBtn">새 게임</button>
          <button id="homeBtn" class="ghost">홈으로</button>
        </div>
      </div>
    </section>

  </main>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
